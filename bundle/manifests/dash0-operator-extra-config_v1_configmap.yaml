apiVersion: v1
data:
  extra.yaml: |-
    initContainerResources:
      {}
    collectorDaemonSetCollectorContainerResources:
      gomemlimit: ""
      limits:
        memory: 500Mi
      requests:
        memory: 500Mi
    collectorDaemonSetConfigurationReloaderContainerResources:
      gomemlimit: ""
      limits:
        memory: 26Mi
      requests:
        memory: 12Mi
    collectorDaemonSetFileLogOffsetSyncContainerResources:
      gomemlimit: ""
      limits:
        memory: 32Mi
      requests:
        memory: 32Mi
    daemonSetTolerations:
      []
    daemonSetNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dash0.com/enable
            operator: NotIn
            values:
            - "false"
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
    daemonSetProbes:
      liveness:
        failureThreshold: 20
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
      readiness:
        failureThreshold: 3
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
      startup:
        failureThreshold: 45
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
    collectorDeploymentCollectorContainerResources:
      gomemlimit: ""
      limits:
        memory: 500Mi
      requests:
        memory: 500Mi
    collectorDeploymentConfigurationReloaderContainerResources:
      gomemlimit: ""
      limits:
        memory: 26Mi
      requests:
        memory: 12Mi
    deploymentTolerations:
      []
    deploymentNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dash0.com/enable
            operator: NotIn
            values:
            - "false"
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
    deploymentProbes:
      liveness:
        failureThreshold: 20
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
      readiness:
        failureThreshold: 3
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
      startup:
        failureThreshold: 45
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
    signalControlCollectorReplicas: 2
    signalControlCollectorContainerResources:
      gomemlimit: ""
      limits:
        memory: 1Gi
      requests:
        memory: 1Gi
    signalControlCollectorConfigurationReloaderContainerResources:
      gomemlimit: ""
      limits:
        memory: 26Mi
      requests:
        memory: 12Mi
    signalControlCollectorTolerations:
      []
    signalControlCollectorNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dash0.com/enable
            operator: NotIn
            values:
            - "false"
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
    signalControlCollectorProbes:
      liveness:
        failureThreshold: 20
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
      readiness:
        failureThreshold: 3
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
      startup:
        failureThreshold: 45
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
    targetAllocatorMtlsEnabled: false
    targetAllocatorMtlsServerCertSecretName: ""
    targetAllocatorMtlsClientCertSecretName: ""
    targetAllocatorAllowInsecureAuthSecrets: false
    targetAllocatorContainerResources:
      gomemlimit: ""
      limits:
        cpu: 200m
        memory: 500Mi
      requests:
        cpu: 200m
        memory: 128Mi
    targetAllocatorTolerations:
      []
    targetAllocatorNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dash0.com/enable
            operator: NotIn
            values:
            - "false"
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
    edgeProxyReplicas: 2
    edgeProxyEnablePprof: false
    edgeProxyContainerResources:
      gomemlimit: ""
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    edgeProxyTolerations:
      []
    edgeProxyNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dash0.com/enable
            operator: NotIn
            values:
            - "false"
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
    agent0ConnectorContainerResources:
      gomemlimit: ""
      limits:
        memory: 256Mi
      requests:
        memory: 64Mi
    agent0ConnectorMaxConcurrentCommands: 2
    agent0ConnectorEnablePprof: false
    agent0ConnectorAllowedKubectlCommands:
      api-resources: true
      api-versions: true
      auth: true
      cluster-info: true
      events: false
      explain: true
      get: true
      logs: false
      top: true
      version: true
    agent0ConnectorTolerations:
      []
    agent0ConnectorNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dash0.com/enable
            operator: NotIn
            values:
            - "false"
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: extra-config-map
    app.kubernetes.io/name: dash0-operator
    app.kubernetes.io/part-of: dash0-operator
    app.kubernetes.io/version: 0.0.1
  name: dash0-operator-extra-config
