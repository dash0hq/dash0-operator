        serviceAccountName: dash0-operator-controller
      deployments:
      - label:
          app.kubernetes.io/component: controller
          app.kubernetes.io/instance: deployment
          app.kubernetes.io/name: dash0-operator
          app.kubernetes.io/part-of: dash0-operator
          app.kubernetes.io/version: 0.0.1
          dash0.com/enable: "false"
        name: dash0-operator-controller
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/name: dash0-operator
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/name: dash0-operator
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: dash0.com/enable
                        operator: NotIn
                        values:
                        - "false"
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
              automountServiceAccountToken: true
              containers:
              - args:
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=127.0.0.1:8080
                - --leader-elect
                command:
                - /manager
                env:
                - name: GOMEMLIMIT
                  value: 205MiB
                - name: DASH0_OPERATOR_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: DASH0_DEPLOYMENT_NAME
                  value: dash0-operator-controller
                - name: DASH0_WEBHOOK_SERVICE_NAME
                  value: dash0-operator-controller-service
                - name: DASH0_WEBHOOK_SERVICE_PORT
                  value: "443"
                - name: DASH0_PERSES_DASHBOARD_AUTO_PATCH_CONVERSION_WEBHOOK
                  value: "false"
                - name: DASH0_IAC_PERIODIC_RETRY_ENABLED
                  value: "true"
                - name: DASH0_IAC_PERIODIC_RETRY_INTERVAL
                  value: 10m
                - name: OTEL_COLLECTOR_NAME_PREFIX
                  value: dash0-operator
                - name: OTEL_TARGET_ALLOCATOR_NAME_PREFIX
                  value: dash0-operator
                - name: DASH0_OPERATOR_IMAGE
                  value: ghcr.io/dash0hq/operator-controller:0.0.0
                - name: DASH0_INSTRUMENTATION_IMAGE
                  value: ghcr.io/dash0hq/instrumentation:0.0.0
                - name: DASH0_COLLECTOR_IMAGE
                  value: ghcr.io/dash0hq/collector:0.0.0
                - name: DASH0_SIGNAL_CONTROL_COLLECTOR_IMAGE
                  value: ghcr.io/dash0hq/signal-control-collector:0.0.0
                - name: DASH0_TARGET_ALLOCATOR_IMAGE
                  value: ghcr.io/dash0hq/target-allocator:0.0.0
                - name: DASH0_CONFIGURATION_RELOADER_IMAGE
                  value: ghcr.io/dash0hq/configuration-reloader:0.0.0
                - name: DASH0_FILELOG_OFFSET_SYNC_IMAGE
                  value: ghcr.io/dash0hq/filelog-offset-sync:0.0.0
                - name: DASH0_FILELOG_OFFSET_VOLUME_OWNERSHIP_IMAGE
                  value: ghcr.io/dash0hq/filelog-offset-volume-ownership:0.0.0
                - name: DASH0_EDGE_PROXY_IMAGE
                  value: ghcr.io/dash0hq/edge-proxy:0.0.0
                - name: DASH0_AGENT0_CONNECTOR_IMAGE
                  value: ghcr.io/dash0hq/agent0-connector:0.0.0
                - name: DASH0_AGENT0_CONNECTOR_ENABLED
                  value: "false"
                - name: DASH0_SYNTHETICS_WORKER_IMAGE
                  value: ghcr.io/dash0hq/dash0-synthetics-worker:0.0.0
                - name: K8S_POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: K8S_NODE_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: K8S_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: K8S_POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: K8S_POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: DASH0_EBPF_PROFILER_ENABLED
                  value: "false"
                - name: DASH0_TELEMETRY_COLLECTION_ENABLED
                  value: "true"
                - name: DASH0_FEATURE_SIGNAL_CONTROL_ENABLED
                  value: "true"
                - name: DASH0_FORCE_USE_OTEL_COLLECTOR_SERVICE_URL
                  value: "false"
                - name: DASH0_GKE_AUTOPILOT
                  value: "false"
                - name: DASH0_OPENSHIFT
                  value: "false"
                - name: DASH0_DISABLE_OTEL_COLLECTOR_HOST_PORTS
                  value: "false"
                - name: DASH0_OTEL_COLLECTOR_OTLP_GRPC_HOST_PORT
                  value: "40317"
                - name: DASH0_OTEL_COLLECTOR_OTLP_HTTP_HOST_PORT
                  value: "40318"
                - name: DASH0_LOG_LEVEL
                  value: info
                - name: RELATED_IMAGE_OPERATOR
                  value: ghcr.io/dash0hq/operator-controller:0.0.0
                - name: RELATED_IMAGE_INSTRUMENTATION
                  value: ghcr.io/dash0hq/instrumentation:0.0.0
                - name: RELATED_IMAGE_COLLECTOR
                  value: ghcr.io/dash0hq/collector:0.0.0
                - name: RELATED_IMAGE_SIGNAL_CONTROL_COLLECTOR
