                - name: RELATED_IMAGE_FILELOG_OFFSET_VOLUME_OWNERSHIP
                  value: ghcr.io/dash0hq/filelog-offset-volume-ownership:0.0.0
                - name: RELATED_IMAGE_EDGE_PROXY
                  value: ghcr.io/dash0hq/edge-proxy:0.0.0
                - name: RELATED_IMAGE_AGENT0_CONNECTOR
                  value: ghcr.io/dash0hq/agent0-connector:0.0.0
                - name: RELATED_IMAGE_SYNTHETICS_WORKER
                  value: ghcr.io/dash0hq/dash0-synthetics-worker:0.0.0
                image: ghcr.io/dash0hq/operator-controller:0.0.0
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 5
                resources:
                  limits:
                    cpu: 500m
                    ephemeral-storage: 500Mi
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    ephemeral-storage: 500Mi
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                - mountPath: /etc/config
                  name: config-volume
                  readOnly: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: dash0-operator-controller
              terminationGracePeriodSeconds: 10
              volumes:
