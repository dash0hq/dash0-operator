apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "dash0.com/v1alpha1",
          "kind": "Dash0Team",
          "metadata": {
            "name": "backend-team"
          },
          "spec": {
            "display": {
              "color": {
                "from": "#6366F1",
                "to": "#8B5CF6"
              },
              "description": "Owns the backend services.",
              "name": "Backend Team"
            },
            "members": [
              "alice@example.com"
            ]
          }
        },
        {
          "apiVersion": "openslo.com/v1",
          "kind": "SLO",
          "metadata": {
            "annotations": {
              "dash0.com/display-name": "Checkout availability"
            },
            "name": "checkout-availability"
          },
          "spec": {
            "budgetingMethod": "Occurrences",
            "description": "99 percent of checkout HTTP requests succeed over a rolling 28-day window.",
            "indicator": {
              "metadata": {
                "name": "checkout-success-ratio"
              },
              "spec": {
                "ratioMetric": {
                  "counter": true,
                  "good": {
                    "metricSource": {
                      "spec": {
                        "query": "http_server_request_duration_seconds_count{service_name=\"checkout\",http_response_status_code!~\"5..\"}"
                      },
                      "type": "Prometheus"
                    }
                  },
                  "total": {
                    "metricSource": {
                      "spec": {
                        "query": "http_server_request_duration_seconds_count{service_name=\"checkout\"}"
                      },
                      "type": "Prometheus"
                    }
                  }
                }
              }
            },
            "objectives": [
              {
                "displayName": "99% availability",
                "target": 0.99
              }
            ],
            "service": "checkout",
            "timeWindow": [
              {
                "duration": "28d",
                "isRolling": true
              }
            ]
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0OperatorConfiguration",
          "metadata": {
            "name": "dash0-operator-configuration"
          },
          "spec": {
            "clusterName": "my-kubernetes-cluster",
            "exports": [
              {
                "dash0": {
                  "apiEndpoint": "https://api.....dash0.com",
                  "authorization": {
                    "secretRef": {
                      "key": "token",
                      "name": "dash0-authorization-secret"
                    }
                  },
                  "endpoint": "ingress..."
                }
              }
            ]
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0SamplingRule",
          "metadata": {
            "name": "keep-all-errors"
          },
          "spec": {
            "conditions": {
              "kind": "error"
            },
            "display": {
              "name": "Keep all error traces"
            },
            "enabled": true
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0SignalControl",
          "metadata": {
            "name": "dash0-signal-control"
          },
          "spec": {
            "enabled": true
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0SignalToMetrics",
          "metadata": {
            "name": "checkout-endpoint-latency"
          },
          "spec": {
            "display": {
              "name": "Checkout endpoint latency"
            },
            "enabled": true,
            "match": {
              "filters": [
                {
                  "key": "http.route",
                  "operator": "is",
                  "value": "/checkout"
                }
              ],
              "signal": "spans"
            },
            "output": {
              "description": "Latency distribution of requests to the checkout endpoint",
              "interval": "30s",
              "name": "checkout.endpoint.duration"
            }
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0SpamFilter",
          "metadata": {
            "name": "drop-kube-system-logs"
          },
          "spec": {
            "contexts": [
              "log"
            ],
            "filter": [
              {
                "key": "k8s.namespace.name",
                "operator": "is",
                "value": "kube-system"
              }
            ]
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0SyntheticCheck",
          "metadata": {
            "name": "example-com"
          },
          "spec": {
            "display": {
              "name": "example.com"
            },
            "enabled": true,
            "notifications": {
              "channels": []
            },
            "plugin": {
              "kind": "http",
              "spec": {
                "assertions": {
                  "criticalAssertions": [
                    {
                      "kind": "status_code",
                      "spec": {
                        "operator": "is",
                        "value": "200"
                      }
                    },
                    {
                      "kind": "timing",
                      "spec": {
                        "operator": "lte",
                        "type": "response",
                        "value": "5000ms"
                      }
                    }
                  ],
                  "degradedAssertions": [
                    {
                      "kind": "timing",
                      "spec": {
                        "operator": "lte",
                        "type": "response",
                        "value": "2000ms"
                      }
                    }
                  ]
                },
                "request": {
                  "headers": [],
                  "method": "get",
                  "queryParameters": [],
                  "redirects": "follow",
                  "tls": {
                    "allowInsecure": false
                  },
                  "tracing": {
                    "addTracingHeaders": false
                  },
                  "url": "https://www.example.com"
                }
              }
            },
            "retries": {
              "kind": "fixed",
              "spec": {
                "attempts": 3,
                "delay": "1s"
              }
            },
            "schedule": {
              "interval": "1m",
              "locations": [
                "de-frankfurt",
                "us-oregon"
              ],
              "strategy": "all_locations"
            }
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0TimeSeriesAggregation",
          "metadata": {
            "name": "aggregate-http-server-duration"
          },
          "spec": {
            "display": {
              "name": "HTTP server duration (aggregated)"
            },
            "enabled": true,
            "match": {
              "metricNameMatcher": {
                "operator": "is",
                "value": "http.server.duration"
              }
            },
            "sample": {
              "interval": "60s"
            }
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1alpha1",
          "kind": "Dash0View",
          "metadata": {
            "name": "error-logs"
          },
          "spec": {
            "display": {
              "description": "Log records with severity error or higher.",
              "name": "Error logs"
            },
            "filter": [
              {
                "key": "otel.log.severity.number",
                "operator": "gte",
                "value": "17"
              }
            ],
            "table": {
              "columns": [
                {
                  "colSize": "min-content",
                  "key": "otel.log.time",
                  "label": "Time"
                },
                {
                  "key": "dash0.resource.id",
                  "label": "Resource"
                },
                {
                  "key": "otel.log.body",
                  "label": "Body"
                }
              ],
              "sort": [
                {
                  "direction": "descending",
                  "key": "otel.log.time"
                }
              ]
            },
            "type": "logs"
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1beta1",
          "kind": "Dash0Monitoring",
          "metadata": {
            "name": "dash0-monitoring-resource"
          },
          "spec": {
            "instrumentWorkloads": {
              "mode": "all"
            },
            "logCollection": {
              "enabled": true
            },
            "prometheusScraping": {
              "enabled": true
            }
          }
        },
        {
          "apiVersion": "operator.dash0.com/v1beta1",
          "kind": "Dash0NotificationChannel",
          "metadata": {
            "name": "slack-alerts"
          },
          "spec": {
            "display": {
              "name": "Slack Alerts"
            },
            "frequency": "10m",
            "slackConfig": {
              "channel": "#alerts",
              "webhookURL": "https://hooks.slack.com/services/..."
            },
            "type": "slack"
          }
        }
      ]
    capabilities: Seamless Upgrades
    categories: Monitoring,Logging & Tracing
    containerImage: ghcr.io/dash0hq/operator-controller:0.0.0
    createdAt: "2026-10-22T18:49:39Z"
    description: The Dash0 Operator gets OpenTelemetry data flowing from your applications
      and infrastructure to Dash0.
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    repository: https://github.com/dash0hq/dash0-operator
    support: Dash0
  name: dash0-operator.v0.0.1
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: A Dash0 notification channel, synchronized to Dash0.
      displayName: Dash0 Notification Channel
      kind: Dash0NotificationChannel
      name: dash0notificationchannels.operator.dash0.com
      specDescriptors:
      - description: The name of the notification channel shown in Dash0.
        displayName: Display
        path: display
      - description: The integration that notifications are sent to. Most types require
          the matching configuration, e.g. Slack Config for "slack".
        displayName: Type
        path: type
      - description: The configuration for Slack webhook notifications.
        displayName: Slack Config
        path: slackConfig
      - description: How often notifications are sent, defaults to 10m.
        displayName: Frequency
        path: frequency
      version: v1beta1
    - description: Cluster-wide settings of the operator, including where telemetry
        is exported to.
      displayName: Dash0 Operator Configuration
      kind: Dash0OperatorConfiguration
      name: dash0operatorconfigurations.operator.dash0.com
      specDescriptors:
      - description: The backends that telemetry and the operator's self-monitoring
          data are sent to.
        displayName: Exports
        path: exports
      - description: Added as the resource attribute k8s.cluster.name to all telemetry.
        displayName: Cluster Name
        path: clusterName
      - description: Resources, scheduling and other settings of the workloads the
          operator manages.
        displayName: Components
        path: components
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Only used internally.
        displayName: Internal
        path: __dash0_internal__normalizedTransform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - description: Only used internally.
        displayName: Internal
        path: monitoringTemplate.spec.__dash0_internal__normalizedTransform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      version: v1alpha1
    - description: A Dash0 sampling rule, synchronized to Dash0.
      displayName: Dash0 Sampling Rule
      kind: Dash0SamplingRule
      name: dash0samplingrules.operator.dash0.com
      specDescriptors:
      - description: Whether the sampling rule is active.
        displayName: Enabled
        path: enabled
      - description: The name of the sampling rule shown in Dash0.
        displayName: Display
        path: display
      - description: The traces that the sampling rule applies to.
        displayName: Conditions
        path: conditions
      version: v1alpha1
    - description: Enables and configures Signal Control.
      displayName: Dash0 Signal Control
      kind: Dash0SignalControl
      name: dash0signalcontrols.operator.dash0.com
      specDescriptors:
      - description: Whether Signal Control is enabled.
        displayName: Enabled
        path: enabled
      - description: Resources, scheduling and other settings of the Signal Control
          workloads.
        displayName: Components
        path: components
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      version: v1alpha1
    - description: A Dash0 signal-to-metrics rule, synchronized to Dash0.
      displayName: Dash0 Signal To Metrics
      kind: Dash0SignalToMetrics
      name: dash0signaltometrics.operator.dash0.com
      specDescriptors:
      - description: Whether the rule is active.
        displayName: Enabled
        path: enabled
      - description: The name of the rule shown in Dash0.
        displayName: Display
        path: display
      - description: The spans and log records that the rule applies to.
        displayName: Match
        path: match
      - description: The metric that is derived from the matching spans and log records.
        displayName: Output
        path: output
      version: v1alpha1
    - description: An OpenSLO service level objective, synchronized to Dash0.
      displayName: SLO
      kind: SLO
      name: slos.openslo.com
      specDescriptors:
      - description: A description of the SLO.
        displayName: Description
        path: description
      - description: The service that the SLO belongs to.
        displayName: Service
        path: service
      - description: How the error budget is calculated, only Occurrences is supported.
        displayName: Budgeting Method
        path: budgetingMethod
      - description: The time window of the SLO, only a rolling 28d window is supported.
        displayName: Time Window
        path: timeWindow
      - description: The service level indicator, a ratio of good to total events.
        displayName: Indicator
        path: indicator
      - description: The target of the SLO, exactly one objective is supported.
        displayName: Objectives
        path: objectives
      version: v1
    - description: A Dash0 spam filter, synchronized to Dash0.
      displayName: Dash0 Spam Filter
      kind: Dash0SpamFilter
      name: dash0spamfilters.operator.dash0.com
      specDescriptors:
      - description: The signals that the spam filter applies to, e.g. log, span or
          metric.
        displayName: Contexts
        path: contexts
      - description: The conditions for the telemetry that is dropped.
        displayName: Filter
        path: filter
      version: v1alpha1
    - description: A Dash0 synthetic check, synchronized to Dash0.
      displayName: Dash0 Synthetic Check
      kind: Dash0SyntheticCheck
      name: dash0syntheticchecks.operator.dash0.com
      specDescriptors:
      - description: Whether the synthetic check is active.
        displayName: Enabled
        path: enabled
      - description: The name of the synthetic check shown in Dash0.
        displayName: Display
        path: display
      - description: The notification channels that are notified when the check fails.
        displayName: Notifications
        path: notifications
      - description: The request that the check performs and the assertions on its
          response.
        displayName: Plugin
        path: plugin
      - description: Whether and how a failed check is retried.
        displayName: Retries
        path: retries
      - description: How often and from which locations the check runs.
        displayName: Schedule
        path: schedule
      version: v1alpha1
    - description: A Dash0 team, synchronized to Dash0.
      displayName: Dash0 Team
      kind: Dash0Team
      name: dash0teams.dash0.com
      specDescriptors:
      - description: The name, description and badge color of the team shown in Dash0.
        displayName: Display
        path: display
      - description: The members of the team, as member IDs or email addresses.
        displayName: Members
        path: members
      version: v1alpha1
    - description: A Dash0 time series aggregation, synchronized to Dash0.
      displayName: Dash0 Time Series Aggregation
      kind: Dash0TimeSeriesAggregation
      name: dash0timeseriesaggregations.operator.dash0.com
      specDescriptors:
      - description: Whether the rule is active.
        displayName: Enabled
        path: enabled
      - description: The name of the rule shown in Dash0.
        displayName: Display
        path: display
      - description: The metrics that the rule applies to.
        displayName: Match
        path: match
      - description: How often the data points of the matching metrics are aggregated.
        displayName: Sample
        path: sample
      version: v1alpha1
    - description: A Dash0 view, synchronized to Dash0.
      displayName: Dash0 View
      kind: Dash0View
      name: dash0views.operator.dash0.com
      specDescriptors:
      - description: The part of the Dash0 UI that the view applies to.
        displayName: Type
        path: type
      - description: The name, description and folder of the view shown in Dash0.
        displayName: Display
        path: display
      - description: The filter of the view.
        displayName: Filter
        path: filter
      - description: The columns and sorting of the table.
        displayName: Table
        path: table
      version: v1alpha1
    - description: Enables monitoring for a namespace, i.e. workload instrumentation,
        log collection and metric scraping.
      displayName: Dash0 Monitoring
      kind: Dash0Monitoring
      name: dash0monitorings.operator.dash0.com
      specDescriptors:
      - description: Automatic instrumentation of the workloads in this namespace.
        displayName: Instrument Workloads
        path: instrumentWorkloads
      - description: Collection of pod logs in this namespace.
        displayName: Log Collection
        path: logCollection
      - description: Scraping of Prometheus metrics from pods in this namespace.
        displayName: Prometheus Scraping
        path: prometheusScraping
      - description: Only used internally.
        displayName: Internal
        path: __dash0_internal__normalizedTransform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      version: v1beta1
  description: |
    The Dash0 Operator makes observability easy for every Kubernetes setup. Install the operator into your cluster to get
    OpenTelemetry data flowing from your applications and infrastructure to Dash0.

    After installing the operator, create a `Dash0OperatorConfiguration` resource with the export settings for your Dash0
    organization, and a `Dash0Monitoring` resource in every namespace that should be monitored.

    Settings that the Helm chart exposes as command-line arguments of the operator manager can be changed via
    `spec.config.env` of the `Subscription`, see the
    [documentation](https://www.dash0.com/docs/dash0/monitoring/kubernetes/dash0-operator/overview). OpenShift and GKE
    Autopilot are not supported by this bundle.
  displayName: Dash0 Operator
