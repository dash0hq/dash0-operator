version: 2
updates:

  # Maintenance note: every update block below sets its own commit-message.prefix explicitly, new blocks should do the
  # same. When a block leaves the prefix unset, Dependabot infers a commit message prefix, and this is not always
  # reliable. The same applies to cooldown.default-days: set it explicitly instead of relying on Dependabot's implicit
  # default.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/images/agent0-connector/src"
      - "/images/configreloader/src"
      - "/images/filelogoffsetsync/src"
      - "/images/pkg/common"
      - "test/e2e"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:05"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"

  # Custom internal-telemetry factory of the OpenTelemetry collector image. This module has a block of its own because
  # the collector modules it requires must not be updated on their own, see the ignore rules below.
  - package-ecosystem: "gomod"
    directory: "/images/collector/src/telemetry"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:10"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"
    allow:
      # Only direct requirements: an indirect version bumped here would become the minimum for the whole collector
      # binary. images/collector/src/telemetry/go.mod is referenced in the collector build, and for dependencies that
      # are in telemetry/go.mod as well as in the go.mod derived from images/collector/src/builder/config.yaml, the
      # build picks the highest version that is mentioned in either file. For that reason, we should not bump indirect
      # dependencies here too eagerly. (They will be bumped by updating direct dependencies and running go mod tidy
      # eventually.)
      - dependency-type: "direct"
    ignore:
      # The collector modules are updated by
      # .github/workflows/scripts/update-collector-components-check-and-bump-versions.sh, together with the component
      # versions in images/collector/src/builder/config.yaml. The factory is compiled into the collector from those
      # versions, so a Dependabot bump would only take the module out of sync with the collector it ends up in. The
      # pattern covers the direct requirements as well as the indirect ones (config/configtelemetry, confmap,
      # featuregate, internal/telemetry).
      - dependency-name: "go.opentelemetry.io/collector/*"
      # Go updates are handled by .github/workflows/update-go-versions.yaml, see the docker block below.
      - dependency-name: "golang"

  # Dash0 OpenTelemetry Distro for Node.js
  - package-ecosystem: "npm"
    directory: "images/instrumentation/node.js/"
    schedule:
      interval: "daily"
      time: "07:10"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # OpenTelemetry Java agent
  - package-ecosystem: "maven"
    directory: "images/instrumentation/jvm/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    commit-message:
      prefix: "chore(deps)"

  # Docker
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/images/agent0-connector"
      - "/images/collector"
      - "/images/configreloader"
      - "/images/filelogoffsetsync"
      - "/images/filelogoffsetvolumeownership"
      - "/images/volumeownership"
      - "/images/instrumentation"
      - "/images/target-allocator"
    schedule:
      interval: "daily"
      time: "07:15"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      production-dependencies:
        dependency-type: "production"
    commit-message:
      prefix: "chore(deps)"
    # The following 'ignore' rules are workarounds to prevent noisy/repeated dependabot PRs
    # that update dependencies to pre-release versions.
    # The rules need to be manually disabled when a new stable minor version is available.
    ignore:
      # Go updates are handled by .github/workflows/update-go-versions.yaml, which updates the golang base images
      # and the `go` directive of all go.mod files together. Dependabot would update them in separate pull requests,
      # which breaks `make go-version-check`.
      - dependency-name: "golang"
      # enable the following `ignore` to prevent upgrades to python pre-releases
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  # -----------------------
  # -- Test applications --
  # -----------------------

  - package-ecosystem: "docker"
    directories:
      - "/test/e2e/otlp-sink/telemetrymatcher"
      - "/test/e2e/dash0-api-mock"
      - "/test/e2e/control-plane-mock"
      - "/test/e2e/decision-maker-mock"
      - "/test/e2e/outbound-connector-mock"
    schedule:
      interval: "daily"
      time: "07:18"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "test"
    ignore:
      # Go updates are handled by .github/workflows/update-go-versions.yaml, see above.
      - dependency-name: "golang"

  - package-ecosystem: "helm"
    directories:
      - "/test/e2e/otlp-sink/helm-chart"
      - "/test-resources/ebpf-profiler/helm-chart"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "test"

  - package-ecosystem: "gomod"
    directories:
      - "test/e2e/dash0-api-mock"
      - "test/e2e/control-plane-mock"
      - "test/e2e/decision-maker-mock"
      - "test/e2e/outbound-connector-mock"
      - "test/e2e/otlp-sink/telemetrymatcher"
      - "test/e2e/pkg/shared"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:15"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "test"
    ignore:
      # Go updates are handled by .github/workflows/update-go-versions.yaml, see above.
      - dependency-name: "golang"

  - package-ecosystem: "maven"
    directory: "test-resources/jvm/spring-boot"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:25"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 4
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "test"

  - package-ecosystem: "npm"
    directories:
      - "test-resources/node.js/express"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "test"
