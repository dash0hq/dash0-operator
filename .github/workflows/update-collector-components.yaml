name: Check for OpenTelemetry Collector Component Updates

on:
  schedule:
    - cron: "15 08 * * MON-FRI"

  workflow_dispatch:

jobs:
  check-and-update:
    name: check for new available OpenTelemetry collector components and update the builder config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Required to update the collector modules of the custom internal-telemetry factory, see
      # .github/workflows/scripts/update-collector-components-check-and-bump-versions.sh.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            images/collector/src/telemetry/go.sum

      - name: check if open PR already exists
        id: open_pr_exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/scripts/update-collector-components-check-if-pr-exists.sh

      # Branches, commits and PRs created with GITHUB_TOKEN do not trigger workflow runs, hence the GitHub app token.
      - name: create GitHub app token
        id: app-token
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DASH0_OPERATOR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASH0_OPERATOR_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: update component versions and create PR
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: .github/workflows/scripts/update-collector-components-create-pr.sh
