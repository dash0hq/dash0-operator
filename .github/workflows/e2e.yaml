name: E2E Failure Probes

on:
  workflow_dispatch:

env:
  DASH0_KIND_CLUSTER: dash0-operator-ci
  DASH0_KIND_CONFIG: /tmp/kind-config.yaml
  LOCAL_REGISTRY_VOLUME_PATH: /tmp/kind-registry
  LOCAL_REGISTRY_NAME: kind-registry
  LOCAL_REGISTRY_PORT: "5001"
  ALLOWED_KUBECTXS: kind-dash0-operator-ci
  E2E_KUBECTX: kind-dash0-operator-ci
  IMAGE_REPOSITORY_PREFIX: "localhost:5001/"

jobs:
  probe-gcp-resource-detector-steps:
    name: Set up cluster and probe the resource detectors
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create volume directories and kind config
        run: |
          # Create directories in /tmp for the kind cluster volumes
          mkdir -p /tmp/offset-storage
          mkdir -p /tmp/kind-registry

          # Create a temporary kind config with /tmp paths
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          # ghcr.io auth so kind nodes can pull the private Signal Control collector and Edge Proxy images
          # directly using the workflow-issued GITHUB_TOKEN (requires packages: read on the job).
          # See https://kind.sigs.k8s.io/docs/user/private-registries/.
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry.configs."ghcr.io".auth]
                username = "${{ github.repository_owner }}"
                password = "${{ secrets.GITHUB_TOKEN }}"
          nodes:
            - role: control-plane
              labels:
                topology.kubernetes.io/zone: zone-a
              extraMounts:
                - hostPath: /tmp/offset-storage
                  containerPath: /offset-storage
            - role: worker
              extraPortMappings:
                - containerPort: 80
                  hostPort: 8080
                  protocol: TCP
                - containerPort: 443
                  hostPort: 4443
                  protocol: TCP
              labels:
                nginx-ingress: "true"
                topology.kubernetes.io/zone: zone-a
              extraMounts:
                - hostPath: /tmp/offset-storage
                  containerPath: /offset-storage
            - role: worker
              labels:
                topology.kubernetes.io/zone: zone-b
              extraMounts:
                - hostPath: /tmp/offset-storage
                  containerPath: /offset-storage
          EOF

      - name: Create kind cluster and registry
        run: |
          ./test-resources/bin/create_cluster_and_registry.sh

      - name: Verify cluster is running
        run: |
          echo "Cluster nodes:"
          kubectl get nodes
          echo ""
          echo "Cluster info:"
          kubectl cluster-info
          echo ""
          echo "All pods:"
          kubectl get pods -A

      - name: Probe the steps of the gcp detector
        if: always()
        run: |
          ./test-resources/bin/probe-gcp-detector.sh | tee /tmp/probe-gcp-detector.txt

      - name: Upload the probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: probe-resource-detectors
          path: |
            /tmp/probe-gcp-detector.txt
          if-no-files-found: ignore
