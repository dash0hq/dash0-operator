name: Check for Synthetics Worker Image Updates

on:
  schedule:
    # Offset from update-sce-images.yaml so the two runs do not race for the same checkout runner minute.
    - cron: "15 09 * * MON-FRI"

  workflow_dispatch:

jobs:
  check-and-update:
    name: check for a new synthetics-worker image tag and update the Helm chart values
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: check if open PR already exists
        id: open_pr_exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/scripts/update-synthetics-worker-image-check-if-pr-exists.sh

      # Branches, commits and PRs created with GITHUB_TOKEN do not trigger workflow runs, hence the GitHub app token.
      - name: create GitHub app token
        id: app-token
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DASH0_OPERATOR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASH0_OPERATOR_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: update image tag and create PR
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: .github/workflows/scripts/update-synthetics-worker-image-create-pr.sh
