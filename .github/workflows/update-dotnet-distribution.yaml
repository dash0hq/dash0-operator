name: Check for Dash0 .NET Distribution Updates

on:
  schedule:
    - cron: "45 09 * * MON"

  workflow_dispatch:

jobs:
  check-and-update:
    name: check for new opentelemetry-dotnet-distribution release and update version file
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: check if open PR already exists
        id: open_pr_exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/scripts/update-dotnet-distribution-check-if-pr-exists.sh

      - name: update opentelemetry-dotnet-distribution version and create PR
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: .github/workflows/scripts/update-dotnet-distribution-create-pr.sh
