name: Check for Signal Control and Edge Proxy Image Updates

on:
  schedule:
    - cron: "45 08 * * MON-FRI"

  workflow_dispatch:

jobs:
  check-and-update:
    name: check for new Signal Control collector and Edge Proxy image tags and update the Helm chart values
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: check if open PR already exists
        id: open_pr_exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/scripts/update-sce-images-check-if-pr-exists.sh

      # Branches, commits and PRs created with GITHUB_TOKEN do not trigger workflow runs, hence the GitHub app token.
      - name: create GitHub app token
        id: app-token
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DASH0_OPERATOR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASH0_OPERATOR_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: update image tags and create PR
        if: steps.open_pr_exists.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: .github/workflows/scripts/update-sce-images-create-pr.sh
