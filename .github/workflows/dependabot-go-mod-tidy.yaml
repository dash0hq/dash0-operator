name: Tidy Go Modules (Dependabot)

# Runs "go mod tidy" for images/agent0-connector/src on Dependabot pull requests and commits the result to the pull
# request branch, see .github/workflows/scripts/dependabot-go-mod-tidy.sh.
#
# The job only runs "go mod tidy", which downloads modules but does not execute their code. Do not add steps that build
# or test the updated code to this job, they would run with a token that can write to the repository.

on:
  pull_request:
    paths:
      - 'images/pkg/common/go.mod'
      - 'images/pkg/common/go.sum'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go-mod-tidy:
    name: run go mod tidy and commit the result
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            images/agent0-connector/src/go.sum
            images/pkg/common/go.sum

      # Commits created with GITHUB_TOKEN do not trigger workflow runs, hence the GitHub app token. Workflow runs
      # triggered by Dependabot only have access to Dependabot secrets, so the app's private key needs to be stored as a
      # Dependabot secret as well.
      - name: create GitHub app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DASH0_OPERATOR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASH0_OPERATOR_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: run go mod tidy and commit the result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: .github/workflows/scripts/dependabot-go-mod-tidy.sh
