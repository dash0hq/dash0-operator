name: Trigger E2E tests via PR comment

# Supported commands (as the first word of the comment, optionally followed by a Ginkgo focus on the same line):
# - /run-e2e: run the e2e tests
# - /run-e2e-then-review: run the e2e tests, and mark the PR as ready for review if they pass
# - /run-e2e-then-merge: run the e2e tests, and enable auto-merge if they pass (refused for draft PRs)

# Every comment is a separate command, a newer comment never supersedes an older one.
# jactionlint ignore=concurrency-limits
on:
  # Only commenters with write access can trigger the tests (see "Check commenter permissions"), and no code of the pull
  # request is checked out.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]

permissions: {}

jobs:
  trigger-e2e:
    name: Trigger E2E tests from PR comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    # Only run for PR comments (not issue comments) that start with /run-e2e
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/run-e2e')

    steps:
      - name: Parse command and optional focus from comment
        id: parse-comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FIRST_LINE=$(printf '%s\n' "$COMMENT_BODY" | head -1 | tr -d '\r')
          COMMAND=${FIRST_LINE%%[[:space:]]*}
          case "$COMMAND" in
            /run-e2e)             ON_SUCCESS=none ;;
            /run-e2e-then-review) ON_SUCCESS=review ;;
            /run-e2e-then-merge)  ON_SUCCESS=merge ;;
            *)
              echo "Ignoring unknown command $COMMAND."
              echo "valid=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Everything after the command on the first line is the optional focus string.
          FOCUS=$(printf '%s' "${FIRST_LINE#"$COMMAND"}" | xargs)
          {
            echo "valid=true"
            echo "on_success=$ON_SUCCESS"
            echo "focus=$FOCUS"
          } >> "$GITHUB_OUTPUT"

      - name: Check commenter permissions
        id: check-permissions
        if: steps.parse-comment.outputs.valid == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              const allowed = ['admin', 'write', 'maintain'].includes(data.permission);
              if (!allowed) {
                core.warning(`User ${context.actor} has '${data.permission}' permission — not enough to trigger E2E tests.`);
              }
              return allowed;
            } catch (err) {
              core.warning(`Could not check permissions for ${context.actor}: ${err.message}`);
              return false;
            }

      - name: Acknowledge comment with reaction
        if: steps.check-permissions.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Get PR branch
        id: pr-info
        if: steps.check-permissions.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('draft', String(pr.draft));

      - name: Refuse auto-merge for draft PR
        if: |
          steps.check-permissions.outputs.result == 'true' &&
          steps.parse-comment.outputs.on_success == 'merge' &&
          steps.pr-info.outputs.draft == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1',
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### :no_entry: E2E tests not triggered',
                '',
                '`/run-e2e-then-merge` is not supported for draft pull requests. Mark the pull request as ready ' +
                  'for review first, or use `/run-e2e-then-review`.',
              ].join('\n'),
            });

      - name: Dispatch e2e workflow
        id: dispatch
        if: |
          steps.check-permissions.outputs.result == 'true' &&
          !(steps.parse-comment.outputs.on_success == 'merge' && steps.pr-info.outputs.draft == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_REF: ${{ steps.pr-info.outputs.ref }}
          FOCUS: ${{ steps.parse-comment.outputs.focus }}
          ON_SUCCESS: ${{ steps.parse-comment.outputs.on_success }}
        with:
          # E2E_DISPATCH_PAT is required because GITHUB_TOKEN cannot trigger workflow_dispatch
          # events on the same repository.
          github-token: ${{ secrets.E2E_DISPATCH_PAT }}
          script: |
            const inputs = {
              pr_number: String(context.issue.number),
              notify_slack: 'false',
            };
            if (process.env.FOCUS) {
              inputs.focus = process.env.FOCUS;
            }
            // Only pass on_success when needed, so that /run-e2e keeps working for branches whose e2e.yaml does not
            // have this input yet.
            if (process.env.ON_SUCCESS !== 'none') {
              inputs.on_success = process.env.ON_SUCCESS;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'e2e.yaml',
              ref: process.env.PR_REF,
              inputs,
            });

      - name: Post trigger comment
        if: steps.dispatch.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_REF: ${{ steps.pr-info.outputs.ref }}
          FOCUS: ${{ steps.parse-comment.outputs.focus }}
          ON_SUCCESS: ${{ steps.parse-comment.outputs.on_success }}
        with:
          script: |
            const focusLine = process.env.FOCUS ? `\n- **Focus**: \`${process.env.FOCUS}\`` : '';
            const onSuccessDescriptions = {
              review: 'mark the pull request as ready for review',
              merge: 'enable auto-merge',
            };
            const onSuccess = onSuccessDescriptions[process.env.ON_SUCCESS];
            const onSuccessLine = onSuccess ? `\n- **On success**: ${onSuccess}` : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### :rocket: E2E tests triggered',
                '',
                `- **Branch**: \`${process.env.PR_REF}\`${focusLine}${onSuccessLine}`,
                `- **Triggered by**: @${context.actor}`,
                '',
                `Results will be posted here once the tests complete. You can also [view the workflow runs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/e2e.yaml) directly.`,
              ].join('\n'),
            });

      - name: Post comment if the dispatch failed
        if: failure() && steps.dispatch.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### :x: E2E tests could not be triggered',
                '',
                `See [run #${process.env.GITHUB_RUN_ID}](${runUrl}) for details. If you used ` +
                  '`/run-e2e-then-review` or `/run-e2e-then-merge`, the branch might need to be rebased onto main.',
              ].join('\n'),
            });
