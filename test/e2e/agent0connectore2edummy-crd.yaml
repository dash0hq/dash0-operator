# A dummy custom resource definition for the e2e test which verifies that a custom cluster role
# (operator.agent0Connector.clusterRole.rules) can widen the agent0-connector's access.
#
# The operator's default cluster role only grants read access to well-known resource types, so a resource type it cannot
# know about is what demonstrates the widening. See the TODO on the corresponding test in e2e_test.go for why this is a
# dedicated CRD and not simply a config map.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agent0connectore2edummies.e2e.dash0.com
spec:
  group: e2e.dash0.com
  names:
    kind: Agent0ConnectorE2eDummy
    listKind: Agent0ConnectorE2eDummyList
    plural: agent0connectore2edummies
    singular: agent0connectore2edummy
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              value:
                type: string
