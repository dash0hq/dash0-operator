# Default settings for the OpenTelemetry Java agent. The operator points the agent at this file via
# OTEL_JAVAAGENT_CONFIGURATION_FILE. The agent ranks this file below environment variables and system properties, so
# OTEL_PROPAGATORS or -Dotel.propagators override these values.
otel.propagators=tracecontext,baggage,xray
