{{ if .Values.operator.syntheticsWorker.enabled }}
{{/*
The -manager-synthetics-worker role holds the permissions the operator needs to manage the synthetics-worker
resources (service account and deployment). Unlike the agent0-connector, the synthetics-worker does not need any
Kubernetes API permissions delegated to its own service account, so there is no corresponding -ro role. All
synthetics-worker resources are created in the operator's own namespace, so a namespaced Role is sufficient; this
role (and its binding) only exist when the synthetics-worker feature is enabled (operator.syntheticsWorker.enabled).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "dash0-operator.chartName" . }}-manager-synthetics-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dash0-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: role-synthetics-worker
    {{- include "dash0-operator.labels" . | nindent 4 }}

rules:

# Permissions required to manage the synthetics-worker service account:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Permissions required to manage the synthetics-worker deployment:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{ end }}
