{{- $selfManagedCertificates := include "dash0-operator.selfManagedCertificates" . }}
{{- $chartName := include "dash0-operator.chartName" . }}
{{- if and .Values.operator.certManager.useCertManager (empty .Values.operator.certManager.certManagerAnnotations) }}
{{- fail "Error: operator.certManager.useCertManager is set to true, but you did not provide any annotations in operator.certManager.certManagerAnnotations. Please refer to the instructions at https://github.com/dash0hq/dash0-operator/tree/main/helm-chart/dash0-operator#using-cert-manager." -}}
{{- end }}
{{- if include "dash0-operator.instrumentationWebhookEnabled" . }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ template "dash0-operator.chartName" . }}-injector
  labels:
    app.kubernetes.io/name: dash0-operator
    app.kubernetes.io/component: injector
    app.kubernetes.io/instance: mutating-webhook
    {{- include "dash0-operator.labels" . | nindent 4 }}
    {{- if $selfManagedCertificates }}
    {{- include "dash0-operator.caBundleInjectionLabel" . | nindent 4 }}
    {{- end }}
  {{- if .Values.operator.certManager.useCertManager }}
  {{- with .Values.operator.certManager.certManagerAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
webhooks:
- name: inject.dash0.com
  admissionReviewVersions:
  - v1
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - kube-node-lease
      {{- if .Values.operator.gke.autopilot.enabled }}
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - gke-gmp-system
          - gke-managed-cim
          - gke-managed-volumepopulator
          - gke-managed-checkpointing
          - gke-managed-parallelstorecsi
          - gke-managed-lustrecsi
          - gke-managed-otel
          - gke-managed-mldiagnostics
          - gke-managed-networking-dra-driver
          - gke-managed-pod-snapshots
      {{- end }}
  clientConfig:
    {{- if $selfManagedCertificates }}
    {{- with include "dash0-operator.liveCaBundle" (dict "kind" "MutatingWebhookConfiguration" "name" (printf "%s-injector" $chartName) "webhook" "inject.dash0.com") }}
    caBundle: {{ . }}
    {{- end }}
    {{- end }}
    service:
      name: {{ template "dash0-operator.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      port: {{ template "dash0-operator.webhookServicePort" . }}
      path: /workloads/inject
  failurePolicy: Ignore
  rules:
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    scope: Namespaced
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cronjobs
  - apiGroups:
      - batch
    apiVersions:
      - v1
    operations:
      # do not listen to UPDATE for jobs, we cannot revert instrumentation or do anything on UPDATE requests, since jobs
      # are immutable
      - CREATE
    resources:
      - jobs
    scope: Namespaced
  - apiGroups: [""]
    apiVersions:
    - v1
    operations:
      # do not listen to UPDATE for pods, we cannot revert instrumentation or do anything on UPDATE requests, since pods
      # are effectively immutable (we cannot restart ownerless pods)
      - CREATE
    resources:
    - pods
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: 5
{{- end }}{{/* closes "if include dash0-operator.instrumentationWebhookEnabled" */}}
