{{- if and .Values.operator.telemetryCollectionEnabled .Values.operator.scrapeCoordinator.allowSecretAccessInNamespaces }}
{{- if not (kindIs "slice" .Values.operator.scrapeCoordinator.allowSecretAccessInNamespaces) }}
{{- fail "Error: operator.scrapeCoordinator.allowSecretAccessInNamespaces must be a list, e.g. --set operator.scrapeCoordinator.allowSecretAccessInNamespaces={namespace-a,namespace-b}." }}
{{- end }}
{{- range $namespace := .Values.operator.scrapeCoordinator.allowSecretAccessInNamespaces | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "dash0-operator.chartName" $ }}-scrape-coordinator-secrets
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/name: dash0-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: role-binding-scrape-coordinator-secrets
    {{- include "dash0-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "dash0-operator.chartName" $ }}-scrape-coordinator-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "dash0-operator.managedResourceNamePrefix" $ }}-scrape-coordinator-sa
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
