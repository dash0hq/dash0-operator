                                    type: object
                                    x-kubernetes-validations:
                                    - message: exactly one of value or valueFrom has
                                        to be provided for a header
                                      rule: has(self.value) != has(self.valueFrom)
                                  type: array
                                insecureSkipVerify:
                                  description: Whether verification of TLS certificates
                                    should be skipped. Ignored when the endpoint uses
                                    an insecure connection.
                                  type: boolean
                              required:
                              - endpoint
