                                      type: boolean
                                    time:
                                      description: Period after which a keepalive
                                        ping is sent on the transport.
                                      type: string
                                    timeout:
                                      description: Time to wait for a keepalive ping
                                        acknowledgement.
                                      type: string
                                  type: object
                              required:
                              - endpoint
                              type: object
                            http:
                              description: The settings for an exporter to send telemetry
                                to an arbitrary OTLP-compatible receiver via HTTP.
                              properties:
                                encoding:
                                  default: proto
                                  description: The encoding of the OTLP data when
                                    sent via HTTP. Can be either proto or json, defaults
