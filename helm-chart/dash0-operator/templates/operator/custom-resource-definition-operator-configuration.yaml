                                    https://app.dash0.com/goto/settings/endpoints?endpoint_type=otlp_grpc. The correct endpoint value will always
                                    start with `ingress.` and end in `dash0.com:4317`.
                                  minLength: 1
                                  type: string
                                keepalive:
                                  description: |-
