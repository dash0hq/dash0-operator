  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
webhooks:
- name: inject.dash0.com
  admissionReviewVersions:
  - v1
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - kube-node-lease
      {{- if .Values.operator.gke.autopilot.enabled }}
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - gke-gmp-system
          - gke-managed-cim
          - gke-managed-volumepopulator
          - gke-managed-checkpointing
          - gke-managed-parallelstorecsi
          - gke-managed-lustrecsi
          - gke-managed-otel
          - gke-managed-mldiagnostics
          - gke-managed-networking-dra-driver
          - gke-managed-pod-snapshots
      {{- end }}
  clientConfig:
    {{- if $selfManagedCertificates }}
    {{- with include "dash0-operator.liveCaBundle" (dict "kind" "MutatingWebhookConfiguration" "name" (printf "%s-injector" $chartName) "webhook" "inject.dash0.com") }}
    caBundle: {{ . }}
    {{- end }}
    {{- end }}
    service:
      name: {{ template "dash0-operator.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      port: {{ template "dash0-operator.webhookServicePort" . }}
      path: /workloads/inject
  failurePolicy: Ignore
  rules:
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    scope: Namespaced
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cronjobs
  - apiGroups:
      - batch
    apiVersions:
      - v1
    operations:
      # do not listen to UPDATE for jobs, we cannot revert instrumentation or do anything on UPDATE requests, since jobs
      # are immutable
      - CREATE
    resources:
      - jobs
    scope: Namespaced
  - apiGroups: [""]
    apiVersions:
    - v1
    operations:
      # do not listen to UPDATE for pods, we cannot revert instrumentation or do anything on UPDATE requests, since pods
      # are effectively immutable (we cannot restart ownerless pods)
      - CREATE
    resources:
    - pods
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: 5
