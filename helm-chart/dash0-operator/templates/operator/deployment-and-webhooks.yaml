                    - all
                    - created-and-updated
                    - pods
                    - none
                    type: string
                  traceContext:
                    description: Optional settings for how trace context is handled
                      in instrumented workloads.
                    properties:
                      propagators:
                        description: |-
                          A comma-separated list of trace context propagators, e.g. "tracecontext,xray" for the W3C traceparent header and
