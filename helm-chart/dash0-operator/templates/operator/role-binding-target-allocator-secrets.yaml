{{- if and .Values.operator.telemetryCollectionEnabled .Values.operator.targetAllocator.allowSecretAccessInNamespaces }}
{{- if not (kindIs "slice" .Values.operator.targetAllocator.allowSecretAccessInNamespaces) }}
{{- fail "Error: operator.targetAllocator.allowSecretAccessInNamespaces must be a list, e.g. --set operator.targetAllocator.allowSecretAccessInNamespaces={namespace-a,namespace-b}." }}
{{- end }}
{{- range $namespace := .Values.operator.targetAllocator.allowSecretAccessInNamespaces | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "dash0-operator.chartName" $ }}-target-allocator-secrets
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/name: dash0-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: role-binding-target-allocator-secrets
    {{- include "dash0-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "dash0-operator.chartName" $ }}-target-allocator-secrets
subjects:
- kind: ServiceAccount
  name: {{ $.Release.Name }}-opentelemetry-target-allocator-sa
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
