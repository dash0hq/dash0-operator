# The default RBAC policy rules for the cluster role the Dash0 operator creates for the agent0-connector.
#
# This file is the single source for these rules within the Helm chart. It is rendered into two places, see the named
# template dash0-operator.agent0ConnectorClusterRoleRules in templates/_helpers.tpl:
# * the -manager-agent0-connector-ro cluster role of the operator, which holds the read permissions the operator
#   delegates to the agent0-connector (Kubernetes' privilege escalation prevention only allows the operator to grant
#   permissions it holds itself), and
# * the cluster role the operator creates for the agent0-connector service account, via the extra config map.
#
# The rules are a copy of defaultAgent0ConnectorRbacRules in
# internal/agent0connector/a0cresources/desired_state.go, which is the list the operator falls back to when the extra
# config map carries no rules. The Go test "drift protection: the default rules of the Helm chart are in sync with
# desired_state.go" in internal/agent0connector/a0cresources/desired_state_test.go parses this file and fails when the
# two lists disagree, so a change here has to be made in the Go list as well.
#
# Users can replace these rules entirely via the Helm value operator.agent0Connector.clusterRole.rules.

# Read-only access to core API group resource types. Resources which can hold sensitive user data (secrets, config maps)
# are deliberately absent, so that they cannot be read at all, independent of the validation & redaction the
# agent0-connector applies to a command request.
- apiGroups:
  - ""
  resources:
  - componentstatuses
  - endpoints
  - events
  - limitranges
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - podtemplates
  - pods
  - pods/log
  - replicationcontrollers
  - resourcequotas
  - serviceaccounts
  - services
  verbs:
  - get
  - list

# Read-only access to the workload resource types:
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list

# Read-only access to the networking resource types:
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  - ingresses
  - ipaddresses
  - networkpolicies
  - servicecidrs
  verbs:
  - get
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list

# Read-only access to the storage resource types:
- apiGroups:
  - storage.k8s.io
  resources:
  - csidrivers
  - csinodes
  - csistoragecapacities
  - storageclasses
  - volumeattachments
  - volumeattributesclasses
  verbs:
  - get
  - list

# Read-only access to further cluster-scoped resource types:
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - get
  - list
- apiGroups:
  - node.k8s.io
  resources:
  - runtimeclasses
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests
  verbs:
  - get
  - list
- apiGroups:
  - flowcontrol.apiserver.k8s.io
  resources:
  - flowschemas
  - prioritylevelconfigurations
  verbs:
  - get
  - list

# Read-only access to the dynamic resource allocation types:
- apiGroups:
  - resource.k8s.io
  resources:
  - deviceclasses
  - resourceclaims
  - resourceclaimtemplates
  - resourceslices
  verbs:
  - get
  - list
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list

# Read-only access to the resource metrics, required by "kubectl top":
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list

# Read-only access to the API surface and admission configuration of the cluster:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
- apiGroups:
  - apiregistration.k8s.io
  resources:
  - apiservices
  verbs:
  - get
  - list
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingadmissionpolicies
  - mutatingadmissionpolicybindings
  - mutatingwebhookconfigurations
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  - validatingwebhookconfigurations
  verbs:
  - get
  - list

# Read-only access to RBAC objects.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  - rolebindings
  - roles
  verbs:
  - get
  - list

# Access to the self subject review API, required by "kubectl auth can-i" and "kubectl auth can-i --list", which let
# the agent0-connector report its own permissions. This is the only rule where "create" is allowed. Creating a
# SelfSubjectAccessReview or a SelfSubjectRulesReview does not persist an object, the API server evaluates the request
# and answers it, and both reviews always report on the caller's own service account.
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  - selfsubjectrulesreviews
  verbs:
  - create

# Read-only access to the Dash0 custom resource types. Resource types are deliberately listed individually and not via
# a wildcard per API group, as adding a new Dash0 CRD might require additional changes in agent0-connector (validation
# and redaction).
- apiGroups:
  - dash0.com
  resources:
  - dash0teams
  verbs:
  - get
  - list
- apiGroups:
  - operator.dash0.com
  resources:
  - dash0monitorings
  - dash0notificationchannels
  - dash0operatorconfigurations
  - dash0samplingrules
  - dash0signalcontrols
  - dash0signaltometrics
  - dash0spamfilters
  - dash0syntheticchecks
  - dash0views
  verbs:
  - get
  - list

# Read-only access to the third-party resource types the operator itself reconciles, so that the agent0-connector can
# diagnose the corresponding operator features.
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  - probes
  - prometheusrules
  - scrapeconfigs
  - servicemonitors
  verbs:
  - get
  - list
- apiGroups:
  - perses.dev
  resources:
  - persesdashboards
  verbs:
  - get
  - list

# Read access to the non-resource URLs kubectl uses (API discovery, OpenAPI schema, server version, health endpoints).
# On a stock cluster this rule grants nothing new: Kubernetes binds the system:discovery cluster role, which covers
# exactly these URLs, to the group system:authenticated, and every service account is a member of that group. The rule
# keeps the agent0-connector working on a cluster that has revoked that default binding.
- nonResourceURLs:
  - '*'
  verbs:
  - get
