suite: test role
templates:
  - operator/role.yaml
tests:
  - it: leader election role should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: should grant permissions to update the webhook certificates secret
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - dash0-operator-webhook-server-cert
            verbs:
              - update

  - it: should not grant permissions to update the webhook certificates secret if cert-manager is used
    set:
      operator:
        certManager:
          useCertManager: true
          secretName: dash0-operator-certificate-secret
          certManagerAnnotations:
            cert-manager.io/inject-ca-from: dash0-system/dash0-operator-serving-certificate
    asserts:
      - notContains:
          path: rules
          content:
            resourceNames:
              - dash0-operator-webhook-server-cert
          any: true

  - it: should retain namespace-scoped profiler cleanup permissions even with telemetry and profiling disabled
    set:
      operator.telemetryCollectionEnabled: false
      operator.ebpfProfilerEnabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services, serviceaccounts]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [networking.k8s.io]
            resources: [networkpolicies]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [configmaps]
            verbs: [get, list, watch, create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
