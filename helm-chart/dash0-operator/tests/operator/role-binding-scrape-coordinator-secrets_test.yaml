suite: test scrape coordinator secrets role bindings
templates:
  - operator/role-binding-scrape-coordinator-secrets.yaml
release:
  name: test-release
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a role binding per namespace in allowSecretAccessInNamespaces
    set:
      operator:
        scrapeCoordinator:
          allowSecretAccessInNamespaces:
            - namespace-a
            - namespace-b
            - namespace-a
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-scrape-coordinator-secrets
          namespace: namespace-a
        documentIndex: 0
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-scrape-coordinator-secrets
          namespace: namespace-b
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: dash0-operator-scrape-coordinator-secrets
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: test-release-scrape-coordinator-sa
              namespace: NAMESPACE

  - it: should reject a single string instead of a list
    set:
      operator:
        scrapeCoordinator:
          allowSecretAccessInNamespaces: namespace-a
    asserts:
      - failedTemplate:
          errorMessage: "Error: operator.scrapeCoordinator.allowSecretAccessInNamespaces must be a list, e.g. --set operator.scrapeCoordinator.allowSecretAccessInNamespaces={namespace-a,namespace-b}."

  - it: should not render if telemetry collection is disabled
    set:
      operator:
        telemetryCollectionEnabled: false
        scrapeCoordinator:
          allowSecretAccessInNamespaces:
            - namespace-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should use operator.managedResourceNamePrefix as the name prefix for the scrape coordinator service account
    release:
      name: dash0-operator-an-argo-cd-application-name
    set:
      operator:
        managedResourceNamePrefix: dash0-operator
        scrapeCoordinator:
          allowSecretAccessInNamespaces:
            - namespace-a
    asserts:
      - equal:
          path: subjects[0].name
          value: dash0-operator-scrape-coordinator-sa
