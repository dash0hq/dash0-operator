suite: test target-allocator secrets role bindings
templates:
  - operator/role-binding-target-allocator-secrets.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a role binding per namespace in allowSecretAccessInNamespaces
    set:
      operator:
        targetAllocator:
          allowSecretAccessInNamespaces:
            - namespace-a
            - namespace-b
    asserts:
      - matchSnapshot: {}
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-target-allocator-secrets
          namespace: namespace-a
        documentIndex: 0
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-target-allocator-secrets
          namespace: namespace-b
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: dash0-operator-target-allocator-secrets
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-opentelemetry-target-allocator-sa
              namespace: NAMESPACE

  - it: should render only one role binding per namespace if a namespace is listed twice
    set:
      operator:
        targetAllocator:
          allowSecretAccessInNamespaces:
            - namespace-a
            - namespace-a
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-target-allocator-secrets
          namespace: namespace-a
        documentIndex: 0

  - it: should reject a single string instead of a list
    set:
      operator:
        targetAllocator:
          allowSecretAccessInNamespaces: namespace-a
    asserts:
      - failedTemplate:
          errorMessage: "Error: operator.targetAllocator.allowSecretAccessInNamespaces must be a list, e.g. --set operator.targetAllocator.allowSecretAccessInNamespaces={namespace-a,namespace-b}."

  - it: should render namespace names that look like numbers or booleans as strings
    set:
      operator:
        targetAllocator:
          allowSecretAccessInNamespaces:
            - "123"
            - "true"
    asserts:
      - equal:
          path: metadata.namespace
          value: "123"
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: "true"
        documentIndex: 1

  - it: should not render if telemetry collection is disabled
    set:
      operator:
        telemetryCollectionEnabled: false
        targetAllocator:
          allowSecretAccessInNamespaces:
            - namespace-a
    asserts:
      - hasDocuments:
          count: 0
