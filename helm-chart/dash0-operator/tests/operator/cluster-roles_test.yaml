suite: test cluster roles
templates:
  - operator/cluster-roles.yaml
tests:
  - it: cluster roles should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: cluster roles should match snapshot with agent0-connector enabled
    set:
      operator:
        agent0Connector:
          enabled: true
    asserts:
      - matchSnapshot: {}

  - it: should grant deployments/finalizers for OwnerReferencesPermissionEnforcement
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments/finalizers
            verbs:
              - update
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-base

  - it: should grant permissions to inject the CA bundle into all CA bundle injection targets
    set:
      operator:
        signalControl:
          enabled: true
    documentSelector:
      path: metadata.name
      value: dash0-operator-manager-base
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - admissionregistration.k8s.io
            resources:
              - mutatingwebhookconfigurations
            resourceNames:
              - dash0-operator-injector
              - dash0-operator-operator-configuration-mutating
              - dash0-operator-monitoring-mutating
            verbs:
              - patch
              - update
      - contains:
          path: rules
          content:
            apiGroups:
              - admissionregistration.k8s.io
            resources:
              - validatingwebhookconfigurations
            resourceNames:
              - dash0-operator-operator-configuration-validator
              - dash0-operator-monitoring-validator
              - dash0-operator-signal-control-validator
            verbs:
              - patch
              - update
      - contains:
          path: rules
          content:
            apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            resourceNames:
              - dash0monitorings.operator.dash0.com
            verbs:
              - patch
              - update

  - it: should not grant permissions to inject the CA bundle if cert-manager is used
    set:
      operator:
        certManager:
          useCertManager: true
          secretName: dash0-operator-certificate-secret
          certManagerAnnotations:
            cert-manager.io/inject-ca-from: dash0-system/dash0-operator-serving-certificate
    documentSelector:
      path: metadata.name
      value: dash0-operator-manager-base
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - admissionregistration.k8s.io
          any: true
      - notContains:
          path: rules
          content:
            resources:
              - mutatingwebhookconfigurations
            verbs:
              - patch
              - update
          any: true
      - notContains:
          path: rules
          content:
            resources:
              - validatingwebhookconfigurations
            verbs:
              - patch
              - update
          any: true
      - notContains:
          path: rules
          content:
            resourceNames:
              - dash0monitorings.operator.dash0.com
          any: true

  - it: should grant permissions to patch the Perses dashboard CRD if the conversion webhook is auto-patched
    documentSelector:
      path: metadata.name
      value: dash0-operator-manager-iac
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            resourceNames:
              - persesdashboards.perses.dev
            verbs:
              - patch
              - update

  - it: should not grant permissions to patch the Perses dashboard CRD if the conversion webhook is not auto-patched
    set:
      operator:
        iac:
          persesDashboard:
            autoPatchConversionWebhook: false
    documentSelector:
      path: metadata.name
      value: dash0-operator-manager-iac
    asserts:
      - notContains:
          path: rules
          content:
            resourceNames:
              - persesdashboards.perses.dev
          any: true
      - contains:
          path: rules
          content:
            apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            verbs:
              - get
              - list
              - watch

  - it: should grant permissions for telemetry collection if telemetry collection is enabled
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-base
        documentIndex: 0
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-iac
        documentIndex: 1
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-collector
        documentIndex: 2
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-instrument
        documentIndex: 3

  - it: should grant pods/eviction regardless of pod-level instrumentation
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods/eviction
            verbs:
              - create
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-instrument

  - it: should not grant permissions for telemetry collection if telemetry collection is disabled
    set:
      operator:
        telemetryCollectionEnabled: false
    asserts:
    - hasDocuments:
        count: 2
    - containsDocument:
        kind: ClusterRole
        apiVersion: rbac.authorization.k8s.io/v1
        name: dash0-operator-manager-base
      documentIndex: 0
    - containsDocument:
        kind: ClusterRole
        apiVersion: rbac.authorization.k8s.io/v1
        name: dash0-operator-manager-iac
      documentIndex: 1

  - it: should grant cluster-wide access to secrets if allowSecretAccessInNamespaces is not set for the target-allocator
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - get
              - list
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-target-allocator-secrets
        not: true

  - it: should only grant the permissions for managing collectors and listing pods in SCE-only mode
    set:
      operator:
        telemetryCollectionEnabled: false
        signalControl:
          enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-collector
        documentIndex: 2
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-instrument
        not: true
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - daemonsets
              - deployments
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - namespaces
            verbs:
              - list
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - get
              - list
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - notContains:
          path: rules
          content:
            nonResourceURLs:
              - /metrics
            verbs:
              - get
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector

  - it: should not grant cluster-wide access to secrets if allowSecretAccessInNamespaces is set for the target-allocator
    set:
      operator:
        targetAllocator:
          allowSecretAccessInNamespaces:
            - namespace-a
    asserts:
      - hasDocuments:
          count: 5
      - notContains:
          path: rules[*].resources
          content: secrets
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-collector
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - get
                - list
                - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-target-allocator-secrets

  - it: should not render the target-allocator secrets cluster role if telemetry collection is disabled
    set:
      operator:
        telemetryCollectionEnabled: false
        targetAllocator:
          allowSecretAccessInNamespaces:
            - namespace-a
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-target-allocator-secrets
        not: true

  - it: should not grant agent0-connector permissions by default
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-agent0-connector-ro
        not: true
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-agent0-connector
        not: true

  - it: should grant agent0-connector permissions if Agent0 connector is enabled
    set:
      operator:
        agent0Connector:
          enabled: true
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-agent0-connector-ro
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - componentstatuses
              - endpoints
              - limitranges
              - namespaces
              - nodes
              - persistentvolumeclaims
              - persistentvolumes
              - podtemplates
              - pods
              - replicationcontrollers
              - resourcequotas
              - serviceaccounts
              - services
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - controllerrevisions
              - daemonsets
              - deployments
              - replicasets
              - statefulsets
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - metrics.k8s.io
            resources:
              - nodes
              - pods
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - authorization.k8s.io
            resources:
              - selfsubjectaccessreviews
              - selfsubjectrulesreviews
            verbs:
              - create
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - monitoring.coreos.com
            resources:
              - podmonitors
              - probes
              - prometheusrules
              - scrapeconfigs
              - servicemonitors
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - perses.dev
            resources:
              - persesdashboards
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - dash0.com
            resources:
              - dash0teams
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - operator.dash0.com
            resources:
              - dash0monitorings
              - dash0notificationchannels
              - dash0operatorconfigurations
              - dash0samplingrules
              - dash0signalcontrols
              - dash0signaltometrics
              - dash0spamfilters
              - dash0syntheticchecks
              - dash0timeseriesaggregations
              - dash0views
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - notContains:
          path: rules
          content:
            apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - notContains:
          path: rules[*].resources
          content: secrets
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - notContains:
          path: rules[*].resources
          content: configmaps
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - notContains:
          path: rules[*].resources
          content: pods/log
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - notContains:
          path: rules[*].resources
          content: events
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            nonResourceURLs:
              - /api
              - /api/*
              - /apis
              - /apis/*
              - /healthz
              - /livez
              - /openapi
              - /openapi/*
              - /readyz
              - /version
              - /version/
            verbs:
              - get
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - notContains:
          path: rules
          content:
            nonResourceURLs:
              - '*'
            verbs:
              - get
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-agent0-connector
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - serviceaccounts
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterroles
              - clusterrolebindings
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector

  - it: should grant agent0-connector management permissions independently of telemetry collection
    set:
      operator:
        telemetryCollectionEnabled: false
        agent0Connector:
          enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-collector
        not: true
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-agent0-connector-ro
        documentIndex: 2
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: dash0-operator-manager-agent0-connector
        documentIndex: 3

  - it: should render custom cluster role rules instead of the default rules for the agent0-connector
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                resources: ["configmaps", "pods"]
                verbs: ["get", "list"]
              - apiGroups: ["authorization.k8s.io"]
                resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
                verbs: ["create"]
              - nonResourceURLs: ["*"]
                verbs: ["get"]
    asserts:
      - lengthEqual:
          path: rules
          count: 3
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
              - pods
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            nonResourceURLs:
              - "*"
            verbs:
              - get
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      # The default rules must be gone entirely, they are replaced and not extended.
      - notContains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - controllerrevisions
              - daemonsets
              - deployments
              - replicasets
              - statefulsets
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro

  - it: should reject custom cluster role rules with a write verb
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list", "delete"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: the verb "delete" is not allowed'

  - it: should reject custom cluster role rules with a wildcard verb
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: ["*"]
                resources: ["*"]
                verbs: ["*"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: the verb "\*" is not allowed'

  - it: should reject custom cluster role rules which grant create beyond the self subject review API
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: ["authorization.k8s.io", ""]
                resources: ["selfsubjectaccessreviews", "pods"]
                verbs: ["create"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: the verb "create" is not allowed'

  # The API server rejects a malformed rule when the manifest is applied, which would leave the installation half
  # applied. These rules have to fail at template time instead.

  - it: should reject a custom cluster role rule without verbs
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                resources: ["pods"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: verbs must contain at least one value'

  - it: should reject a custom cluster role rule which mixes resources and non-resource URLs
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                nonResourceURLs: ["*"]
                verbs: ["get"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: a rule cannot apply to both regular resources and non-resource URLs'

  - it: should reject a custom cluster role rule which mixes resource names and non-resource URLs
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - resourceNames: ["some-pod"]
                nonResourceURLs: ["*"]
                verbs: ["get"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: a rule cannot apply to both regular resources and non-resource URLs'

  - it: should reject a custom cluster role rule without apiGroups
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - resources: ["pods"]
                verbs: ["get"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: a rule for regular resources must supply at least one apiGroup'

  - it: should reject a custom cluster role rule without resources
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                verbs: ["get"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules\[0\]: a rule for regular resources must supply at least one resource'

  - it: should accept a custom cluster role rule which only addresses non-resource URLs
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - nonResourceURLs: ["*"]
                verbs: ["get"]
    asserts:
      - equal:
          path: rules
          value:
            - nonResourceURLs:
                - '*'
              verbs:
                - get
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro

  - it: should reject a malformed custom cluster role rule
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: "get"
    asserts:
      - failedTemplate:
          errorPattern: "range can't iterate over get"

  - it: should reject custom cluster role rules which are not a list
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              pods:
                apiGroups: [""]
                resources: ["pods"]
                verbs: ["get"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules must be a list of RBAC policy rules'

  - it: should render the default rules plus the additional cluster role rules for the agent0-connector
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            additionalRules:
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["get", "list"]
              - apiGroups: ["example.com"]
                resources: ["widgets"]
                verbs: ["get", "list"]
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      - contains:
          path: rules
          content:
            apiGroups:
              - example.com
            resources:
              - widgets
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro
      # The default rules are kept, the additional rules extend them.
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - controllerrevisions
              - daemonsets
              - deployments
              - replicasets
              - statefulsets
            verbs:
              - get
              - list
        documentSelector:
          path: metadata.name
          value: dash0-operator-manager-agent0-connector-ro

  - it: should reject setting both custom cluster role rules and additional cluster role rules
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list"]
            additionalRules:
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["get", "list"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.rules and operator.agent0Connector.clusterRole.additionalRules are mutually exclusive'

  - it: should reject additional cluster role rules with a write verb
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            additionalRules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list", "delete"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.additionalRules\[0\]: the verb "delete" is not allowed'

  - it: should reject additional cluster role rules which grant create beyond the self subject review API
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            additionalRules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get"]
              - apiGroups: ["authorization.k8s.io", ""]
                resources: ["selfsubjectaccessreviews", "pods"]
                verbs: ["create"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.additionalRules\[1\]: the verb "create" is not allowed'

  - it: should reject a malformed additional cluster role rule
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            additionalRules:
              - apiGroups: [""]
                verbs: ["get"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.additionalRules\[0\]: a rule for regular resources must supply at least one resource'

  - it: should reject additional cluster role rules which are not a list
    set:
      operator:
        agent0Connector:
          enabled: true
          clusterRole:
            additionalRules:
              configmaps:
                apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["get", "list"]
    asserts:
      - failedTemplate:
          errorPattern: 'operator.agent0Connector.clusterRole.additionalRules must be a list of RBAC policy rules'
