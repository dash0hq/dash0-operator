suite: test separate OpenShift eBPF profiler SCC
templates:
  - operator/openshift-ebpf-profiler-scc.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render on OpenShift without profiler opt-in
    set:
      operator.openShift.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for a profiler on a non-OpenShift cluster
    set:
      operator.ebpfProfilerEnabled: true
      operator.ebpfProfilerImage.tag: test-agent
    asserts:
      - hasDocuments:
          count: 0

  - it: should allow privileged root host PID and read-only proc and sys only
    set:
      operator.openShift.enabled: true
      operator.ebpfProfilerEnabled: true
      operator.ebpfProfilerImage.tag: test-agent
    documentSelector:
      path: kind
      value: SecurityContextConstraints
    asserts:
      - equal:
          path: allowPrivilegedContainer
          value: true
      - equal:
          path: allowHostPID
          value: true
      - equal:
          path: runAsUser.type
          value: RunAsAny
      - equal:
          path: allowHostNetwork
          value: false
      - equal:
          path: allowedHostPaths
          value:
            - pathPrefix: /proc
              readOnly: true
            - pathPrefix: /sys
              readOnly: true

  - it: should bind only the profiler service account in the release namespace
    release:
      name: profiling
      namespace: observability
    set:
      operator.openShift.enabled: true
      operator.ebpfProfilerEnabled: true
      operator.ebpfProfilerImage.tag: test-agent
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: profiling-ebpf-profiler-scc-use
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: profiling-ebpf-profiler
              namespace: observability

  - it: should grant use only of the profiler SCC
    set:
      operator.openShift.enabled: true
      operator.ebpfProfilerEnabled: true
      operator.ebpfProfilerImage.tag: test-agent
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [security.openshift.io]
              resources: [securitycontextconstraints]
              resourceNames: [RELEASE-NAME-ebpf-profiler]
              verbs: [use]
