suite: test webhook configurations
templates:
  - operator/webhook-configurations.yaml
release:
  name: test-release
tests:
  - it: should check certManagerAnnotations when using cert-manager
    set:
      operator:
        certManager:
          useCertManager: true
          secretName: dash0-operator-certificate-secret
    asserts:
      - failedTemplate:
          errorMessage: "Error: operator.certManager.useCertManager is set to true, but you did not provide any annotations in operator.certManager.certManagerAnnotations. Please refer to the instructions at https://github.com/dash0hq/dash0-operator/tree/main/helm-chart/dash0-operator#using-cert-manager."

  - it: should not render the injector webhook in SCE-only mode
    set:
      operator:
        telemetryCollectionEnabled: false
        signalControl:
          enabled: true
    asserts:
      - containsDocument:
          kind: MutatingWebhookConfiguration
          apiVersion: admissionregistration.k8s.io/v1
          name: dash0-operator-injector
        not: true

  - it: should not render the injector webhook if workload instrumentation is disabled
    set:
      operator:
        instrumentation:
          enabled: false
    asserts:
      - containsDocument:
          kind: MutatingWebhookConfiguration
          apiVersion: admissionregistration.k8s.io/v1
          name: dash0-operator-injector
        not: true

  - it: should still render the other webhooks if workload instrumentation is disabled
    documentSelector:
      path: metadata.name
      value: dash0-operator-monitoring-mutating
    set:
      operator:
        instrumentation:
          enabled: false
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration

  - it: should render the injector webhook if operator.instrumentation.enabled is unset
    documentSelector:
      path: metadata.name
      value: dash0-operator-injector
    set:
      operator:
        instrumentation:
          enabled: null
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration

  - it: should render the injector webhook when Signal Control is enabled together with telemetry collection
    documentSelector:
      path: metadata.name
      value: dash0-operator-injector
    set:
      operator:
        signalControl:
          enabled: true
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration

  - it: should not render the injector webhook when telemetry collection is disabled without Signal Control
    set:
      operator:
        telemetryCollectionEnabled: false
    asserts:
      - containsDocument:
          kind: MutatingWebhookConfiguration
          apiVersion: admissionregistration.k8s.io/v1
          name: dash0-operator-injector
        not: true

  - it: webhook configurations should not render a caBundle if the live objects cannot be read
    set:
      operator:
        signalControl:
          enabled: true
    asserts:
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        documentSelector:
          path: metadata.name
          value: dash0-operator-injector
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-mutating
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-validator
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        documentSelector:
          path: metadata.name
          value: dash0-operator-signal-control-validator
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-mutating
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-validator

  - it: webhook configurations should render the live caBundle
    set:
      operator:
        signalControl:
          enabled: true
    kubernetesProvider:
      scheme:
        "admissionregistration.k8s.io/v1/MutatingWebhookConfiguration":
          gvr:
            group: admissionregistration.k8s.io
            version: v1
            resource: mutatingwebhookconfigurations
          namespaced: false
        "admissionregistration.k8s.io/v1/ValidatingWebhookConfiguration":
          gvr:
            group: admissionregistration.k8s.io
            version: v1
            resource: validatingwebhookconfigurations
          namespaced: false
      objects:
        - apiVersion: admissionregistration.k8s.io/v1
          kind: MutatingWebhookConfiguration
          metadata:
            name: dash0-operator-injector
          webhooks:
            - name: inject.dash0.com
              clientConfig:
                caBundle: bGl2ZS1pbmplY3Rvcg==
        - apiVersion: admissionregistration.k8s.io/v1
          kind: MutatingWebhookConfiguration
          metadata:
            name: dash0-operator-operator-configuration-mutating
          webhooks:
            - name: mutate-operator-configuration.dash0.com
              clientConfig:
                caBundle: bGl2ZS1vYy1tdXRhdGluZw==
        - apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingWebhookConfiguration
          metadata:
            name: dash0-operator-operator-configuration-validator
          webhooks:
            - name: validate-operator-configuration.dash0.com
              clientConfig:
                caBundle: bGl2ZS1vYy12YWxpZGF0b3I=
        - apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingWebhookConfiguration
          metadata:
            name: dash0-operator-signal-control-validator
          webhooks:
            - name: validate-signal-control.dash0.com
              clientConfig:
                caBundle: bGl2ZS1zYy12YWxpZGF0b3I=
        - apiVersion: admissionregistration.k8s.io/v1
          kind: MutatingWebhookConfiguration
          metadata:
            name: dash0-operator-monitoring-mutating
          webhooks:
            - name: mutate-monitoring.dash0.com
              clientConfig:
                caBundle: bGl2ZS1tLW11dGF0aW5n
        - apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingWebhookConfiguration
          metadata:
            name: dash0-operator-monitoring-validator
          webhooks:
            - name: some-other-webhook.dash0.com
              clientConfig:
                caBundle: b3RoZXItd2ViaG9vaw==
            - name: validate-monitoring.dash0.com
              clientConfig:
                caBundle: bGl2ZS1tLXZhbGlkYXRvcg==
    asserts:
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: bGl2ZS1pbmplY3Rvcg==
        documentSelector:
          path: metadata.name
          value: dash0-operator-injector
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: bGl2ZS1vYy1tdXRhdGluZw==
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-mutating
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: bGl2ZS1vYy12YWxpZGF0b3I=
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-validator
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: bGl2ZS1zYy12YWxpZGF0b3I=
        documentSelector:
          path: metadata.name
          value: dash0-operator-signal-control-validator
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: bGl2ZS1tLW11dGF0aW5n
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-mutating
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: bGl2ZS1tLXZhbGlkYXRvcg==
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-validator

  - it: webhook configurations should not render a caBundle if cert-manager is used, even if a live caBundle exists
    set:
      operator:
        certManager:
          useCertManager: true
          secretName: dash0-operator-certificate-secret
          certManagerAnnotations:
            cert-manager.io/inject-ca-from: dash0-system/dash0-operator-serving-certificate
    kubernetesProvider:
      scheme:
        "admissionregistration.k8s.io/v1/MutatingWebhookConfiguration":
          gvr:
            group: admissionregistration.k8s.io
            version: v1
            resource: mutatingwebhookconfigurations
          namespaced: false
      objects:
        - apiVersion: admissionregistration.k8s.io/v1
          kind: MutatingWebhookConfiguration
          metadata:
            name: dash0-operator-injector
          webhooks:
            - name: inject.dash0.com
              clientConfig:
                caBundle: bGl2ZS1pbmplY3Rvcg==
    documentSelector:
      path: metadata.name
      value: dash0-operator-injector
    asserts:
      - notExists:
          path: webhooks[0].clientConfig.caBundle

  - it: should label all CA bundle injection targets
    set:
      operator:
        signalControl:
          enabled: true
    asserts:
      - equal:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: dash0-operator-injector
      - equal:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-mutating
      - equal:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-validator
      - equal:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: dash0-operator-signal-control-validator
      - equal:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-mutating
      - equal:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-validator

  - it: should not label any object as CA bundle injection target if cert-manager is used
    set:
      operator:
        signalControl:
          enabled: true
        certManager:
          useCertManager: true
          secretName: dash0-operator-certificate-secret
          certManagerAnnotations:
            cert-manager.io/inject-ca-from: dash0-system/dash0-operator-serving-certificate
    asserts:
      - notExists:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
        documentSelector:
          path: metadata.name
          value: dash0-operator-injector
      - notExists:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-mutating
      - notExists:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
        documentSelector:
          path: metadata.name
          value: dash0-operator-operator-configuration-validator
      - notExists:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
        documentSelector:
          path: metadata.name
          value: dash0-operator-signal-control-validator
      - notExists:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-mutating
      - notExists:
          path: metadata.labels["dash0.com/inject-ca-bundle"]
        documentSelector:
          path: metadata.name
          value: dash0-operator-monitoring-validator
