suite: test webhook certificates secret
templates:
  - operator/webhook-certificates-secret.yaml
release:
  name: test-release
tests:
  - it: webhook certificates secret should be rendered without data
    documentSelector:
      path: metadata.name
      value: dash0-operator-webhook-server-cert
    asserts:
      - equal:
          path: kind
          value: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - notExists:
          path: data
      - notExists:
          path: stringData

  - it: webhook certificates secret should not be rendered if cert-manager is used
    set:
      operator:
        certManager:
          useCertManager: true
          secretName: dash0-operator-certificate-secret
          certManagerAnnotations:
            cert-manager.io/inject-ca-from: dash0-system/dash0-operator-serving-certificate
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: dash0-operator-webhook-server-cert
          namespace: NAMESPACE
        not: true

  - it: legacy certificates secret should not be rendered if it does not exist
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: dash0-operator-certificates
          namespace: NAMESPACE
        not: true

  - it: legacy certificates secret should be rendered unchanged as long as it exists
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          type: kubernetes.io/tls
          metadata:
            name: dash0-operator-certificates
            namespace: NAMESPACE
          data:
            ca.crt: bGVnYWN5LWNh
            tls.crt: bGVnYWN5LWNlcnQ=
            tls.key: bGVnYWN5LWtleQ==
    documentSelector:
      path: metadata.name
      value: dash0-operator-certificates
    asserts:
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: data
          value:
            ca.crt: bGVnYWN5LWNh
            tls.crt: bGVnYWN5LWNlcnQ=
            tls.key: bGVnYWN5LWtleQ==
