              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Dash0TelemetryTransformationRuleSpec defines the desired
              state of a telemetry transformation rule.
            properties:
              conditions:
                items:
                  type: string
                type: array
              context:
                description: Dash0TelemetryTransformationRuleContext identifies the
                  OTTL evaluation context.
                enum:
                - resource
                - scope
