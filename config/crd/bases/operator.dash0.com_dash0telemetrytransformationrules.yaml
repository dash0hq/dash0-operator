    listKind: Dash0TelemetryTransformationRuleList
    plural: dash0telemetrytransformationrules
    singular: dash0telemetrytransformationrule
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Dash0TelemetryTransformationRule defines a telemetry transformation
          rule synchronized to Dash0.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
