apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Seamless Upgrades
    categories: Monitoring,Logging & Tracing
    description: Collect traces, metrics and logs from your Kubernetes workloads and infrastructure with OpenTelemetry
      and send them to Dash0.
    repository: https://github.com/dash0hq/dash0-operator
    support: Dash0
  name: dash0-operator.v0.0.0
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Turns on monitoring for its namespace, with automatic workload instrumentation, log collection and
        Prometheus scraping.
      displayName: Dash0 Monitoring
      kind: Dash0Monitoring
      name: dash0monitorings.operator.dash0.com
      specDescriptors:
      - description: Automatic instrumentation of the workloads in this namespace.
        displayName: Instrument Workloads
        path: instrumentWorkloads
      - description: Collection of pod logs in this namespace.
        displayName: Log Collection
        path: logCollection
      - description: Scraping of Prometheus metrics from pods in this namespace.
        displayName: Prometheus Scraping
        path: prometheusScraping
      - description: Only used internally.
        displayName: Internal
        path: __dash0_internal__normalizedTransform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      version: v1beta1
    - description: Cluster-wide operator settings, such as the Dash0 endpoints and auth token, the cluster name and
        which Kubernetes telemetry is collected.
      displayName: Dash0 Operator Configuration
      kind: Dash0OperatorConfiguration
      name: dash0operatorconfigurations.operator.dash0.com
      specDescriptors:
      - description: The backends that telemetry and the operator's self-monitoring data are sent to.
        displayName: Exports
        path: exports
      - description: Added as the resource attribute k8s.cluster.name to all telemetry.
        displayName: Cluster Name
        path: clusterName
      - description: Resources, scheduling and other settings of the workloads the operator manages.
        displayName: Components
        path: components
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Only used internally.
        displayName: Internal
        path: __dash0_internal__normalizedTransform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - description: Only used internally.
        displayName: Internal
        path: monitoringTemplate.spec.__dash0_internal__normalizedTransform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      version: v1alpha1
    - description: Turns on Signal Control, which samples and filters telemetry inside the cluster before it is sent
        to Dash0. Only one instance per cluster.
      displayName: Dash0 Signal Control
      kind: Dash0SignalControl
      name: dash0signalcontrols.operator.dash0.com
      specDescriptors:
      - description: Whether Signal Control is enabled.
        displayName: Enabled
        path: enabled
      - description: Resources, scheduling and other settings of the Signal Control workloads.
        displayName: Components
        path: components
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      version: v1alpha1
    - description: A tail sampling rule that decides which traces Signal Control keeps, for example all traces with
        errors.
      displayName: Dash0 Sampling Rule
      kind: Dash0SamplingRule
      name: dash0samplingrules.operator.dash0.com
      specDescriptors:
      - description: Whether the sampling rule is active.
        displayName: Enabled
        path: enabled
      - description: The name of the sampling rule shown in Dash0.
        displayName: Display
        path: display
      - description: The traces that the sampling rule applies to.
        displayName: Conditions
        path: conditions
      version: v1alpha1
    - description: A destination for Dash0 alert notifications, for example a Slack channel, email recipients or a
        webhook.
      displayName: Dash0 Notification Channel
      kind: Dash0NotificationChannel
      name: dash0notificationchannels.operator.dash0.com
      specDescriptors:
      - description: The name of the notification channel shown in Dash0.
        displayName: Display
        path: display
      - description: The integration that notifications are sent to. Most types require the matching configuration,
          e.g. Slack Config for "slack".
        displayName: Type
        path: type
      - description: The configuration for Slack webhook notifications.
        displayName: Slack Config
        path: slackConfig
      - description: How often notifications are sent, defaults to 10m.
        displayName: Frequency
        path: frequency
      version: v1beta1
    - description: A rule that derives a custom metric from spans or log records.
      displayName: Dash0 Signal-to-Metrics Rule
      kind: Dash0SignalToMetrics
      name: dash0signaltometrics.operator.dash0.com
      specDescriptors:
      - description: Whether the rule is active.
        displayName: Enabled
        path: enabled
      - description: The name of the rule shown in Dash0.
        displayName: Display
        path: display
      - description: The spans and log records that the rule applies to.
        displayName: Match
        path: match
      - description: The metric that is derived from the matching spans and log records.
        displayName: Output
        path: output
      version: v1alpha1
    - description: A filter that drops unwanted log records, spans or metrics based on their attributes.
      displayName: Dash0 Spam Filter
      kind: Dash0SpamFilter
      name: dash0spamfilters.operator.dash0.com
      specDescriptors:
      - description: The signals that the spam filter applies to, e.g. log, span or metric.
        displayName: Contexts
        path: contexts
      - description: The conditions for the telemetry that is dropped.
        displayName: Filter
        path: filter
      version: v1alpha1
    - description: A synthetic check that tests an HTTP endpoint on a schedule from one or more locations.
      displayName: Dash0 Synthetic Check
      kind: Dash0SyntheticCheck
      name: dash0syntheticchecks.operator.dash0.com
      specDescriptors:
      - description: Whether the synthetic check is active.
        displayName: Enabled
        path: enabled
      - description: The name of the synthetic check shown in Dash0.
        displayName: Display
        path: display
      - description: The notification channels that are notified when the check fails.
        displayName: Notifications
        path: notifications
      - description: The request that the check performs and the assertions on its response.
        displayName: Plugin
        path: plugin
      - description: Whether and how a failed check is retried.
        displayName: Retries
        path: retries
      - description: How often and from which locations the check runs.
        displayName: Schedule
        path: schedule
      version: v1alpha1
    - description: A rule that aggregates the data points of matching metrics over a fixed interval.
      displayName: Dash0 Time Series Aggregation
      kind: Dash0TimeSeriesAggregation
      name: dash0timeseriesaggregations.operator.dash0.com
      specDescriptors:
      - description: Whether the rule is active.
        displayName: Enabled
        path: enabled
      - description: The name of the rule shown in Dash0.
        displayName: Display
        path: display
      - description: The metrics that the rule applies to.
        displayName: Match
        path: match
      - description: How often the data points of the matching metrics are aggregated.
        displayName: Sample
        path: sample
      version: v1alpha1
    - description: A saved Dash0 view with a filter and table layout for exploring telemetry such as logs, spans or
        metrics.
      displayName: Dash0 View
      kind: Dash0View
      name: dash0views.operator.dash0.com
      specDescriptors:
      - description: The part of the Dash0 UI that the view applies to.
        displayName: Type
        path: type
      - description: The name, description and folder of the view shown in Dash0.
        displayName: Display
        path: display
      - description: The filter of the view.
        displayName: Filter
        path: filter
      - description: The columns and sorting of the table.
        displayName: Table
        path: table
      version: v1alpha1
    - description: A Dash0 team and its members.
      displayName: Dash0 Team
      kind: Dash0Team
      name: dash0teams.dash0.com
      specDescriptors:
      - description: The name, description and badge color of the team shown in Dash0.
        displayName: Display
        path: display
      - description: The members of the team, as member IDs or email addresses.
        displayName: Members
        path: members
      version: v1alpha1
    - description: A service level objective in the OpenSLO format.
      displayName: Service Level Objective
      kind: SLO
      name: slos.openslo.com
      specDescriptors:
      - description: A description of the SLO.
        displayName: Description
        path: description
      - description: The service that the SLO belongs to.
        displayName: Service
        path: service
      - description: How the error budget is calculated, only Occurrences is supported.
        displayName: Budgeting Method
        path: budgetingMethod
      - description: The time window of the SLO, only a rolling 28d window is supported.
        displayName: Time Window
        path: timeWindow
      - description: The service level indicator, a ratio of good to total events.
        displayName: Indicator
        path: indicator
      - description: The target of the SLO, exactly one objective is supported.
        displayName: Objectives
        path: objectives
      version: v1
  description: |
    The Dash0 Operator brings OpenTelemetry-based observability to your Kubernetes cluster. It instruments your
    workloads automatically, collects their traces, metrics and logs together with telemetry about the cluster itself,
    and sends everything to Dash0.

    ### Features

    * **Automatic instrumentation** of Java, Node.js and .NET workloads, without changes to images or manifests.
      Python and Ruby support (beta) is opt-in.
    * **Log collection** from the pods in monitored namespaces.
    * **Kubernetes infrastructure metrics** for the cluster, its nodes, pods and containers.
    * **Prometheus scraping** of pods annotated with `prometheus.io/scrape`.
    * **Signal Control**: tail sampling, spam filters and signal-to-metrics rules, applied inside the cluster to keep
      the telemetry that matters and reduce egress costs.
    * **Dash0 configuration as code**: views, synthetic checks, notification channels, teams, SLOs and more are managed
      as Kubernetes resources and kept in sync with Dash0.

    ### Getting started

    Install the operator into a dedicated namespace, for example `dash0-system`. The OpenTelemetry collectors run in
    that namespace and use host paths and host ports, so the namespace must not enforce the `baseline` or `restricted`
    Pod Security Standard. This rules out the `operators` namespace that OLM creates, which enforces `baseline`.

    After the installation:

    1. Create a Secret with your Dash0 auth token in the operator's namespace.
    2. Create a `Dash0OperatorConfiguration` resource with the OTLP and API endpoints of your Dash0 organization and a
       reference to that Secret.
    3. Create a `Dash0Monitoring` resource in each namespace you want to monitor. Most Dash0 configuration resources,
       like views and synthetic checks, are only synchronized in namespaces that have a `Dash0Monitoring` resource.

    Some operator settings are read from `DASH0_*` environment variables, which can be set in `spec.config.env` of the
    Subscription. For example, `DASH0_ENABLE_PYTHON_AUTO_INSTRUMENTATION=true` turns on Python instrumentation.

    This bundle does not support OpenShift or GKE Autopilot.
  displayName: Dash0 Operator
  install:
    spec:
      deployments: null
    strategy: ""
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - OpenTelemetry
  - Observability
  - Monitoring
  - Dash0
  - Node.js
  - Java
  - JVM
  - .NET
  - Python
  - Ruby
  links:
  - name: Dash0
    url: https://www.dash0.com/
  - name: Source Code
    url: https://github.com/dash0hq/dash0-operator
  - name: Documentation
    url: https://www.dash0.com/docs/dash0/monitoring/kubernetes/dash0-operator/overview
  maintainers:
  - email: bastian.krol@dash0.com
    name: Bastian Krol
  - email: petra.bierleutgeb@dash0.com
    name: Petra Bierleutgeb
  - email: felix.thieltges@dash0.com
    name: Felix Thieltges
  maturity: alpha
  minKubeVersion: 1.25.16
  provider:
    name: Dash0 Inc.
    url: https://www.dash0.com/
  version: 0.0.0
