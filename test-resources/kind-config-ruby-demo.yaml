# Simple kind cluster config for the Ruby auto-instrumentation demo.
# No volume mounts or port mappings needed: traffic is generated by sidecars
# inside the cluster and traces are exported directly to Dash0 via OTLP.
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
