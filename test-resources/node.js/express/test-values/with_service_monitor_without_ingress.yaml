# Like with_service_monitor.yaml, but without an ingress, so that the deployment can be installed in more than one
# namespace (ingress-nginx rejects two ingresses with the same host and path).
deployment:
  enabled: true
  ingressPath: ""
  prometheus:
    annotations:
      enabled: false
    serviceMonitor:
      enabled: true
