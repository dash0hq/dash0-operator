apiVersion: v1
kind: Secret
metadata:
  name: operator-test-slack
stringData:
  webhook-url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
---
apiVersion: operator.dash0.com/v1beta1
kind: Dash0NotificationChannel
metadata:
  name: operator-test-slack-from-secret
spec:
  display:
    name: Slack Alerts From Secret
  type: slack
  slackConfig:
    webhookURLFrom:
      secretKeyRef:
        name: operator-test-slack
        key: webhook-url
    channel: "#alerts"
  frequency: 10m
