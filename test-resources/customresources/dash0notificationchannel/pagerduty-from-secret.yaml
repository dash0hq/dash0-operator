apiVersion: v1
kind: Secret
metadata:
  name: operator-test-pagerduty
stringData:
  integration-key: "00000000000000000000000000000000"
---
apiVersion: operator.dash0.com/v1beta1
kind: Dash0NotificationChannel
metadata:
  name: operator-test-pagerduty-from-secret
spec:
  display:
    name: PagerDuty Alerts From Secret
  type: pagerduty
  pagerdutyConfig:
    keyFrom:
      secretKeyRef:
        name: operator-test-pagerduty
        key: integration-key
    url: "https://events.pagerduty.com/v2/enqueue"
  frequency: 10m
