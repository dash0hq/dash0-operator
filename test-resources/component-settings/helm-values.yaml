# Helm values for test-scenario-12-component-settings.sh. They differ from the values in spec.components, except for
# daemonSetProbes, which is set to its default and hence does not count as a conflict.
operator:
  initContainerResources:
    limits:
      memory: 200Mi
    requests:
      memory: 100Mi
  collectors:
    daemonSetCollectorContainerResources:
      limits:
        memory: 600Mi
      requests:
        memory: 600Mi
    daemonSetPodLabels:
      dash0.com/component-settings-test: helm
    daemonSetTolerations:
      - key: dash0.com/component-settings-test
        operator: Equal
        value: helm
        effect: NoSchedule
    daemonSetProbes:
      readiness:
        periodSeconds: 2
    deploymentPriorityClassName: d0-operator-manager-prio
    deploymentProbes:
      liveness:
        failureThreshold: 30
    signalControlCollectorReplicas: 3
    signalControlCollectorAnnotations:
      dash0.com/component-settings-test: helm
  targetAllocator:
    allowInsecureAuthSecrets: true
    podAnnotations:
      dash0.com/component-settings-test: helm
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: dash0.com/enable
                operator: NotIn
                values: ["false"]
              - key: kubernetes.io/os
                operator: In
                values: ["linux"]
              - key: kubernetes.io/hostname
                operator: Exists
  signalControl:
    edgeProxy:
      replicas: 3
      containerResources:
        requests:
          # Not kept: spec.components.edgeProxy.containerResources is merged with the defaults, not the Helm values.
          memory: 320Mi
      labels:
        dash0.com/component-settings-test: helm
