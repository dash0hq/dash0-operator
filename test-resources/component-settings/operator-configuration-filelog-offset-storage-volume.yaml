# A merge patch for the Dash0 operator configuration resource that sets the filelog offset volume, see
# deploy_filelog_offsets_pvc in test-resources/bin/lib/util for the persistent volume claim.
spec:
  components:
    daemonSetCollector:
      filelogOffsetStorageVolume:
        persistentVolumeClaim:
          claimName: offset-storage-claim
