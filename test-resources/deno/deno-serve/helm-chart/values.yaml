image:
  repository: dash0-operator-deno-serve-test-app
  tag: latest
  pullPolicy: Never

resources:
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 500Mi
  requests:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 500Mi

daemonset:
  enabled: false
  port: 1806
  targetPort: 1806
  selector: dash0-operator-deno-serve-test-daemonset-app
  ingressPath: /daemonset/deno-serve(/|$)(.*)

deployment:
  enabled: false
  port: 1807
  targetPort: 1807
  selector: dash0-operator-deno-serve-test-deployment-app
  ingressPath: /deployment/deno-serve(/|$)(.*)

pod:
  enabled: false
  port: 1811
  targetPort: 1811
  selector: dash0-operator-deno-serve-test-pod-app
  ingressPath: /pod/deno-serve(/|$)(.*)

replicaset:
  enabled: false
  port: 1809
  targetPort: 1809
  selector: dash0-operator-deno-serve-test-replicaset-app
  ingressPath: /replicaset/deno-serve(/|$)(.*)

statefulset:
  enabled: false
  port: 1810
  targetPort: 1810
  selector: dash0-operator-deno-serve-test-statefulset-app
  ingressPath: /statefulset/deno-serve(/|$)(.*)
